name: Build and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Verify Windows PySide6 GUI & Universal Design Accessibility Audit
        run: |
          python test_gemvox.py

      - name: Build Standalone EXE and Portable ZIP
        run: |
          python build_release.py

      - name: Publish GitHub Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          Write-Host "Publishing release assets for tag $tag..."
          $releaseExists = $false
          try {
            gh release view $tag > $null 2>&1
            if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release upload $tag dist/Gemvox_Standalone.exe dist/Gemvox_*_Portable.zip --clobber
          } else {
            gh release create $tag dist/Gemvox_Standalone.exe dist/Gemvox_*_Portable.zip --title "Gemvox $tag - Accessible Gemini TTS Studio" --notes-file RELEASE_NOTES.md
          }


