name: Build and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.1.6)'
        required: false
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Build Standalone EXE and Portable ZIP
        run: |
          python build_release.py

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          gh release upload $tag dist/Gemvox_Standalone.exe dist/Gemvox_*_Portable.zip --clobber
