name: Build and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.1.7)'
        required: false
        default: 'v1.1.7'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Verify Windows wxPython GUI & Audio Transport Bar Instantiation
        run: |
          python -c "import wx; app = wx.App(False); from gemvox.config import config; from gemvox.ui.main_window import MainWindow; from gemvox.ui.dialogs import HelpDialog, InlineTagDialog, StylePresetDialog, CreateCustomStyleDialog, WelcomeTourDialog, GenerationHistoryDialog, UpdateDialog; config.set('first_run_completed', True); w = MainWindow(); [Dlg(w).Destroy() for Dlg in (HelpDialog, InlineTagDialog, StylePresetDialog, CreateCustomStyleDialog, WelcomeTourDialog, GenerationHistoryDialog)]; w.Destroy(); print('Windows wxPython GUI Smoke Test Passed!')"

      - name: Build Standalone EXE and Portable ZIP
        run: |
          python build_release.py

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          gh release upload $tag dist/Gemvox_Standalone.exe dist/Gemvox_*_Portable.zip --clobber

